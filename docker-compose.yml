services:
  plexbot:
    build: .
    image: ghcr.io/ukly0/plexbot:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    env_file:
      - config/.env
    volumes:
      - ./config:/app/config:ro
      - plexbot-data:/data
      # Mount your media libraries here. Paths must match config/libraries.yaml roots.
      # Use docker-compose.override.yml or edit directly:
      # - /your/host/tv:/media/tv
      # - /your/host/movies:/media/movies
      # - /your/host/anime:/media/anime
    restart: unless-stopped

volumes:
  plexbot-data:
