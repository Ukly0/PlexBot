services:
  plexbot:
    build: .
    image: plexbot:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    env_file:
      - config/.env
    volumes:
      - ./config:/app/config:ro
      - plexbot-data:/data
      # Mount your media libraries below. Paths must match config/libraries.yaml roots.
      # Example:
      - /media/storage/data/media/tv:/media/tv
      - /media/storage/data/media/movies:/media/movies
      - /media/storage/data/media/anime:/media/anime
    restart: unless-stopped

volumes:
  plexbot-data:
