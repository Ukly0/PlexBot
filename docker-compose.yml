services:
  plexbot:
    image: ghcr.io/ukly0/telegram-to-plex:latest
    build: .
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    env_file:
      - config/.env
    volumes:
      - ./config:/app/config:ro
      - plexbot-data:/data
      # Map your media library paths here.
      # These must match the 'root' values in config/libraries.yaml.
      # - /your/host/tv:/media/tv
      # - /your/host/movies:/media/movies
      # - /your/host/anime:/media/anime
    restart: unless-stopped

volumes:
  plexbot-data:
